[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-digital-fte-backend"
version = "0.1.0"
description = "Multi-tenant Restaurant Order-Taking Digital FTE backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.6,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "openai-agents>=0.2,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "aiosqlite>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
